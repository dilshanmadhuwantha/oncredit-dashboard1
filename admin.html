<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin – Oncredit</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}body{font-family:'Inter',sans-serif;background:#0a192f;color:#e2e8f0;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;}
.box{background:#1e293b;padding:40px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.4);width:100%;max-width:500px;}
h2{text-align:center;margin-bottom:24px;color:#00d4ff;font-weight:700;}
label{display:block;margin:16px 0 6px;font-weight:600;color:#94a3b8;}
input{padding:12px;border:1px solid #334155;border-radius:8px;width:100%;background:#0a192f;color:#e2e8f0;font-size:16px;}
.btn{width:100%;padding:14px;background:#00d4ff;color:#0a192f;border:none;border-radius:8px;font-weight:600;cursor:pointer;margin-top:20px;transition:.3s;}
.btn:hover{background:#00b0d4;}
.success{color:#51cf66;text-align:center;margin:12px 0;}
.hidden{display:none;}
.back{position:absolute;top:20px;left:20px;color:#94a3b8;font-size:1.4rem;text-decoration:none;}
</style>
</head>
<body>

<a href="index.html" class="back">Back</a>

<div class="box" id="login">
  <h2>Admin Login</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button class="btn" onclick="login()">Login</button>
  <div id="error" style="color:#ff6b6b;text-align:center;margin-top:10px;"></div>
</div>

<div class="box hidden" id="form">
  <h2>Update Department Data</h2>

  <label>Department Target (LKR)</label><input type="number" id="target">
  <label>Money Collected (YTD)</label><input type="number" id="collected">
  <label>Prolongation Count</label><input type="number" id="prolongation">
  <label>Restructure Count</label><input type="number" id="restructure">
  <label>Total Call Count</label><input type="number" id="calls">
  <label>Active Staff Count</label><input type="number" id="activeStaff">

  <h3 style="margin:24px 0 12px;color:#00d4ff;">Best Performers</h3>
  <label>Overall Best – Name</label><input type="text" id="overallName">
  <label>Overall Best – Image URL</label><input type="text" id="overallImg">
  <label>Overall Best – Collection (LKR)</label><input type="number" id="overallAmount">

  <label>Pre Due Best – Name</label><input type="text" id="predueName">
  <label>Pre Due Best – Image URL</label><input type="text" id="predueImg">
  <label>Pre Due Best – Collection (LKR)</label><input type="number" id="predueAmount">

  <label>Past Due Best – Name</label><input type="text" id="pastdueName">
  <label>Past Due Best – Image URL</label><input type="text" id="pastdueImg">
  <label>Past Due Best – Collection (LKR)</label><input type="number" id="pastdueAmount">

  <div id="msg" class="success hidden">Saved! All team members see new data instantly.</div>
  <button class="btn" onclick="save()">Save to Cloud</button>
</div>

<script>
// YOUR CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyBI1wea7fQkOAfSom4WOo1Ch6lsjt_MuIA",
  authDomain: "oncredit-dashboard.firebaseapp.com",
  projectId: "oncredit-dashboard",
  storageBucket: "oncredit-dashboard.firebasestorage.app",
  messagingSenderId: "442565003852",
  appId: "1:442565003852:web:820bf17253e6921c4602e9"
};
firebase.initializeApp(firebaseConfig);
const ref = firebase.database().ref('oncredit_dept_data');

const ADMIN = { username: "admin", password: "oncredit2025" };

function login(){
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  if(u === ADMIN.username && p === ADMIN.password){
    document.getElementById('login').classList.add('hidden');
    document.getElementById('form').classList.remove('hidden');
    load();
  } else {
    document.getElementById('error').textContent = "Wrong username or password";
  }
}

function load(){
  ref.once('value').then(snap => {
    const d = snap.val() || {};
    const fields = ['target','collected','prolongation','restructure','calls','activeStaff',
                    'overallName','overallImg','overallAmount',
                    'predueName','predueImg','predueAmount',
                    'pastdueName','pastdueImg','pastdueAmount'];
    fields.forEach(f => document.getElementById(f).value = d[f] || '');
  });
}

function save(){
  const data = {
    target: Number(document.getElementById('target').value),
    collected: Number(document.getElementById('collected').value),
    prolongation: Number(document.getElementById('prolongation').value),
    restructure: Number(document.getElementById('restructure').value),
    calls: Number(document.getElementById('calls').value),
    activeStaff: Number(document.getElementById('activeStaff').value),
    overallName: document.getElementById('overallName').value,
    overallImg: document.getElementById('overallImg').value,
    overallAmount: Number(document.getElementById('overallAmount').value),
    predueName: document.getElementById('predueName').value,
    predueImg: document.getElementById('predueImg').value,
    predueAmount: Number(document.getElementById('predueAmount').value),
    pastdueName: document.getElementById('pastdueName').value,
    pastdueImg: document.getElementById('pastdueImg').value,
    pastdueAmount: Number(document.getElementById('pastdueAmount').value),
    timestamp: new Date().toISOString()
  };
  ref.set(data).then(() => {
    document.getElementById('msg').classList.remove('hidden');
    setTimeout(() => document.getElementById('msg').classList.add('hidden'), 3000);
  });
}
</script>
</body>
</html>
