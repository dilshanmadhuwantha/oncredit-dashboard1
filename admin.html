<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin – Update Data</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#0a192f;color:#e2e8f0;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px;}
.box{background:#1e293b;padding:40px;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.5);width:100%;max-width:520px;}
h2{text-align:center;color:#00d4ff;margin-bottom:30px;font-size:1.8rem;}
label{display:block;margin:16px 0 8px;color:#94a3b8;font-weight:600;}
input, textarea{padding:14px;border-radius:10px;border:1px solid #334155;background:#0a192f;color:#fff;width:100%;font-size:1rem;}
.btn{width:100%;padding:16px;background:#00d4ff;color:#0a192f;border:none;border-radius:12px;font-weight:700;font-size:1.1rem;cursor:pointer;margin-top:30px;}
.btn:hover{background:#00b8d4;}
.msg{margin-top:20px;text-align:center;font-weight:bold;font-size:1.2rem;padding:12px;border-radius:10px;}
.success{background:#225c34;color:#51cf66;}
.error{background:#5c2222;color:#ff6b6b;}
</style>
</head>
<body>

<div class="box">
  <h2>Admin – Update Dashboard</h2>
  <p style="text-align:center;color:#94a3b8;margin-bottom:20px;">After filling → click button → copy all text → replace in data.json on GitHub</p>

  <label>Department Target (LKR)</label><input type="number" id="target" value="496000000">
  <label>Money Collected (YTD)</label><input type="number" id="collected" value="163993000">
  <label>Prolongation Count</label><input type="number" id="prolongation" value="412">
  <label>Restructure Count</label><input type="number" id="restructure" value="43">
  <label>Total Call Count</label><input type="number" id="calls" value="125000">
  <label>Active Staff Count</label><input type="number" id="activeStaff" value="55">

  <h3 style="color:#00d4ff;margin:30px 0 15px;">Best Performers</h3>
  <label>Overall Best – Name</label><input type="text" id="overallName" value="Eshan">
  <label>Overall Best – Image URL</label><input type="text" id="overallImg">
  <label>Overall Best – Collection</label><input type="number" id="overallAmount" value="5029283">

  <label>Pre Due Best – Name</label><input type="text" id="predueName" value="Eshan">
  <label>Pre Due Best – Image URL</label><input type="text" id="predueImg">
  <label>Pre Due Best – Collection</label><input type="number" id="predueAmount" value="4419213">

  <label>Past Due Best – Name</label><input type="text" id="pastdueName" value="Sandali">
  <label>Past Due Best – Image URL</label><input type="text" id="pastdueImg">
  <label>Past Due Best – Collection</label><input type="number" id="pastdueAmount" value="2149650">

  <button class="btn" onclick="generate()">Generate JSON → Copy & Replace in GitHub</button>
  <div id="msg" class="msg" style="display:none;"></div>
  <textarea id="output" style="margin-top:20px;height:200px;display:none;"></textarea>
</div>

<script>
function generate() {
  const data = {
    target: Number(document.getElementById('target').value) || 0,
    collected: Number(document.getElementById('collected').value) || 0,
    prolongation: Number(document.getElementById('prolongation').value) || 0,
    restructure: Number(document.getElementById('restructure').value) || 0,
    calls: Number(document.getElementById('calls').value) || 0,
    activeStaff: Number(document.getElementById('activeStaff').value) || 0,
    overallName: document.getElementById('overallName').value,
    overallImg: document.getElementById('overallImg').value,
    overallAmount: Number(document.getElementById('overallAmount').value) || 0,
    predueName: document.getElementById('predueName').value,
    predueImg: document.getElementById('predueImg').value,
    predueAmount: Number(document.getElementById('predueAmount').value) || 0,
    pastdueName: document.getElementById('pastdueName').value,
    pastdueImg: document.getElementById('pastdueImg').value,
    pastdueAmount: Number(document.getElementById('pastdueAmount').value) || 0,
    timestamp: new Date().toISOString()
  };

  const jsonStr = JSON.stringify(data, null, 2);
  document.getElementById('output').value = jsonStr;
  document.getElementById('output').style.display = 'block';
  document.getElementById('msg').textContent = 'COPY THE TEXT ABOVE → REPLACE IN data.json ON GITHUB';
  document.getElementById('msg').className = 'msg success';
  document.getElementById('msg').style.display = 'block';
  document.getElementById('output').select();
}
</script>
</body>
</html>
